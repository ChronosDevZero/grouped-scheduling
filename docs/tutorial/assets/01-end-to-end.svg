  <text x="480" y="424" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0F766E">Mono.Cecil stubs + fields</text>

  <rect x="760" y="150" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="900" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0F172A">SchedulingWeaveHooks</text>
  <text x="900" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Schedule* / ScheduleStatic*</text>

  <rect x="760" y="260" width="280" height="70" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
  <text x="900" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="600" fill="#0F172A">ActionsHandler</text>
  <text x="900" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">nest check, track, shutdown</text>

  <rect x="760" y="370" width="130" height="80" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="825" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Fully</text>
  <text x="825" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Concurrent</text>

  <rect x="910" y="370" width="130" height="80" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="975" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Exclusive</text>
  <text x="975" y="425" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0F766E">GroupLane</text>

