  <line x1="600" y1="410" x2="750" y2="185" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="220" x2="900" y2="255" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="330" x2="825" y2="365" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="330" x2="975" y2="365" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="450" x2="860" y2="485" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="975" y1="450" x2="940" y2="485" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="550" x2="900" y2="585" stroke="#B45309" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="280" width="240" height="120" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Authoring surface</text>
  <text x="160" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">ScheduleGroupAttribute</text>
  <text x="160" y="365" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">ScheduleMode</text>
  <text x="160" y="385" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">AddGroupedScheduling()</text>
</svg>
