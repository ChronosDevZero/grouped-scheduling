  <text x="880" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F766E">RUN TIME</text>

  <rect x="40" y="150" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0F172A">[ScheduleGroup]</text>
  <text x="160" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">async method body</text>

  <rect x="360" y="150" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Roslyn analyzers</text>
  <text x="480" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#B45309">TSCH001-005</text>

  <rect x="360" y="260" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
