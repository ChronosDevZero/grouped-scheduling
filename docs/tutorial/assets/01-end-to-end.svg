  <text x="900" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0F172A">Your original method body</text>

  <rect x="760" y="590" width="280" height="60" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="900" y="618" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Host Stop to HandlerRegistry</text>
  <text x="900" y="638" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9A3412">ShutdownAllAsync (30s drain)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
