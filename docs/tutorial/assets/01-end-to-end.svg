  <text x="480" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">CoreCompile output</text>

  <rect x="360" y="370" width="240" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
