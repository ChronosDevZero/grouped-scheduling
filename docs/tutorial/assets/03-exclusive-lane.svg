<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
  <rect width="1280" height="780" fill="#F7F9FC"/>
  <text x="640" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#0F172A">Exclusive lane (GroupLaneScheduler)</text>
  <text x="640" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">One active exclusive group, FIFO waiting groups, serial or parallel grants</text>

  <rect x="440" y="120" width="400" height="100" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="3"/>
  <text x="640" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">_activeGroup = "orders"</text>
  <text x="640" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Running count on GroupRuntime</text>
  <text x="640" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0F766E">ExclusiveSerial: Running &lt;= 1</text>

  <text x="200" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">_waitingGroups (FIFO)</text>
  <rect x="60" y="300" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="130" y="335" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0F172A">"reports"</text>
  <rect x="220" y="300" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="290" y="335" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0F172A">"billing"</text>
  <text x="400" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">...</text>
  <text x="400" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">other groups wait</text>

  <text x="640" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">How Acquire behaves</text>

  <rect x="60" y="450" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="240" y="485" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#0F766E">ExclusiveSerial</text>
  <text x="240" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Lane: one exclusive group active</text>
  <text x="240" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Inside group: one task at a time</text>
  <text x="240" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">GrantWaiters wakes exactly one</text>

  <rect x="460" y="450" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="640" y="485" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#0F766E">ExclusiveParallel</text>
  <text x="640" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Lane: one exclusive group active</text>
  <text x="640" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Inside group: many may overlap</text>
  <text x="640" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">GrantWaiters wakes all waiters</text>

  <rect x="860" y="450" width="360" height="130" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="1040" y="485" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#B45309">FullyConcurrent</text>
  <text x="1040" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Does not enter this lane</text>
  <text x="1040" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">Runs immediately (still nested)</text>
  <text x="1040" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9A3412">Handled in ActionsHandler only</text>

  <rect x="300" y="620" width="680" height="100" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="640" y="655" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">On last Release of active group</text>
  <text x="640" y="685" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#334155">_activeGroup = null then PromoteNext_NoLock()</text>
  <text x="640" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Activate head of FIFO waiting list and grant its waiters</text>
</svg>
